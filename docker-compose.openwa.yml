version: '3.8'

services:
  openwa:
    image: ghcr.io/rmyndharis/openwa:latest
    container_name: aleen_openwa_gateway
    restart: unless-stopped
    ports:
      - "2785:2785"
    environment:
      - PORT=2785
      - ENGINE_TYPE=baileys
      - API_KEY=aleen_secret_key
      - MAX_SESSIONS=5
      - NODE_ENV=production
    volumes:
      - openwa_sessions:/app/sessions
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:2785/api/sessions"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  openwa_sessions:
    driver: local
