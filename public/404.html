<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Aleen Clothing • Loading Invoice...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages / Static Hosting
      // Preserves paths and query strings across 404s to client-side router
      var pathSegmentsToKeep = 0;
      var l = window.location;
      var path = l.pathname.slice(1);
      
      // If deployed under subpath (e.g. /Aleen-react2/), preserve it
      var repoMatches = l.pathname.match(/^\/([^\/]+)/);
      var repo = repoMatches ? repoMatches[1] : '';
      if (repo && (repo.toLowerCase().indexOf('aleen') !== -1 || repo.toLowerCase().indexOf('react') !== -1)) {
        pathSegmentsToKeep = 1;
      }

      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;

      window.location.replace(redirectUrl);
    </script>
  </head>
  <body>
    <p>Redirecting to Aleen E-Bill...</p>
  </body>
</html>
